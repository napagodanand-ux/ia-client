name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm exec prettier --check .
      - run: pnpm exec vitest run
      - run: pnpm exec playwright test --list
      - name: banned-copy literals
        run: bash scripts/banned-copy-check.sh banned-copy/banned-literals.txt app components lib
      - name: install ripgrep (banned-copy gates)
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          rg --version
      - name: banned-copy regex
        run: |
          set -u
          set +e
          if ! command -v rg >/dev/null 2>&1; then
            echo "BANNED-COPY-REGEX: rg missing (CI FAIL)" >&2
            exit 2
          fi
          rg --pcre2 -in -f banned-copy/banned-regex.txt app components lib
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "BANNED-COPY-REGEX: match found (CI FAIL)" >&2
            exit 1
          fi
          if [ $rc -eq 1 ]; then
            echo "BANNED-COPY-REGEX: clean (CI PASS)"
            exit 0
          fi
          echo "BANNED-COPY-REGEX: scanner error rc=$rc (CI FAIL)" >&2
          exit 2
